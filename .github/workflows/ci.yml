name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit and end-to-end tests
        run: pytest -q

      - name: Run evals (recorded responses)
        run: |
          python scripts/simulate_runs.py
          python -m evalkit run --out reports

      - name: Quality gate
        run: python -m evalkit check --summary reports/summary.json

      - name: Publish report to the job summary
        if: always()
        run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-report
          path: reports/
