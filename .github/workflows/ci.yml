name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit and end-to-end tests
        run: pytest -q

      - name: Run evals (recorded responses)
        run: |
          python scripts/simulate_runs.py
          python -m evalkit run --out reports

      - name: Quality gate
        run: python -m evalkit check --summary reports/summary.json

      - name: Publish report to the job summary
        if: always()
        run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
